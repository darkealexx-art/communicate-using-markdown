[project]
name = "news_analyst"
version = "0.1.0"
description = "Sistema automatizado para análisis y síntesis de noticias."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "feedparser==6.0.11",
    "PyYAML==6.0.2",
    "python-docx==1.1.2",
    "requests==2.32.3",
]

[project.scripts]
news-analyst = "news_analyst.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
